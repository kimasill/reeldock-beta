name: 오류 제보
description: 재현 단계와 영향을 알려주세요.
title: "[오류] "
body:
  - type: markdown
    attributes:
      value: "여기는 공개 게시판입니다. 비밀정보나 원본 녹화 영상을 첨부하지 마세요."
  - type: input
    id: version
    attributes:
      label: 앱 버전 / Windows / GPU
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 단계와 기대한 결과
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 실제 결과 / 비밀정보를 제거한 오류 문구
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 영향
      options: ["녹화 파일 손실 또는 손상", "원하지 않는 소리 또는 화면", "녹화 시작 불가", "편의 / 표시 문제", "기타"]
    validations:
      required: true
